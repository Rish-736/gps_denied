# Nav2 tuned for the NIDAR AirMouse drone in a 1.5m-corridor maze.
#
# Differs from Nav2's stock config in ways that matter here:
#  - motion_model "Omni": a multirotor can strafe. In 1.5m corridors that's a
#    big win over DiffDrive, which must rotate before it can move sideways.
#  - inflation_radius 0.45 (stock 0.70): 0.70 floods a 1.5m corridor with high
#    cost and the planner gives up. 0.45 leaves a usable centre channel.
#  - slower everything: stock speeds are for a ground robot with instant stop;
#    a drone has momentum and tilts to accelerate (which skews the 2D scan).
#  - no AMCL / map_server: Cartographer provides both /map and map->odom.
#
# Frames: map -> odom -> base_link, all published by Cartographer.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml is set in the launch file to a RECOVERY-FREE
    # tree (navigate_w_replanning_time.xml): plan -> follow -> replan, and on
    # failure just abort. The stock tree runs a Spin recovery on planning
    # failure, which for a drone in a 1.5m corridor means a 180-deg spin-in-place
    # that destabilises it into a wall. A failed plan should make the explorer
    # pick another frontier, NOT make the aircraft spin.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    # Must satisfy: model_dt >= 1/controller_frequency, or MPPI refuses to
    # configure ("Controller period more then model dt"). 20Hz <-> 0.05s.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loose tolerances: we only need to reach the general area of a frontier
      # to reveal it, and a drone can't hold position to a few cm anyway.
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 3.14
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05        # matches controller_frequency 20Hz; 40*0.05 = 2s horizon
      batch_size: 1500
      # Slowed hard for a drone in tight corridors. A multirotor tilts to
      # accelerate (which skews the 2D scan) and can't stop on a dime; gentle,
      # low speeds track far better and keep it off the walls. Tune up later
      # once it's reliably not crashing.
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.2
      vx_max: 0.22
      vx_min: -0.12
      vy_max: 0.22
      wz_max: 0.6
      ax_max: 0.6
      ax_min: -0.6
      ay_max: 0.6
      ay_min: -0.6
      az_max: 1.0
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"        # multirotor can strafe - key for tight corridors
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.5          # raised: hitting a wall is the failure mode here
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.35          # ~true x500 prop-tip radius; routes paths off walls
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.40    # 2.0m corridor -> 1.2m centre channel; routes down the middle, not hugging walls
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.35
      resolution: 0.05
      # Unknown space must stay unknown - that's exactly what the frontier
      # explorer hunts for. If it were treated as free there'd be no frontiers.
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.40
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.4
      use_astar: true
      # Must be true for exploration: frontier goals sit right at the boundary
      # of unknown space, so a planner that refuses unknown cells can't reach them.
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
